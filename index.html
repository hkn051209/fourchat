<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4人のおへや</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7a8b8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おへや">
<style>
  :root{
    --bg:#fdf3e3;
    --ink:#4a3f35;
    --pink:#f7a8b8;
    --lav:#b7a6e8;
    --sky:#8ec9e8;
    --sun:#f5c86e;
    --card:#fffdf8;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:
      radial-gradient(circle at 12% 20%, #ffe9f0 0 60px, transparent 61px),
      radial-gradient(circle at 88% 78%, #e6f3ff 0 80px, transparent 81px),
      var(--bg);
    display:flex; flex-direction:column;
  }

  /* ===== 入室画面 ===== */
  #gate{
    flex:1; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .gate-card{
    background:var(--card); border-radius:24px; padding:28px 22px; width:100%; max-width:360px;
    box-shadow:0 8px 30px rgba(190,140,90,.18); text-align:center;
  }
  .gate-card h1{ font-size:22px; margin:0 0 4px; }
  .gate-card p.sub{ margin:0 0 20px; font-size:13px; opacity:.75; }
  .name-btns{ display:flex; gap:12px; margin-bottom:16px; }
  .name-btn{
    flex:1; border:3px solid transparent; background:#fff; border-radius:18px; padding:14px 6px;
    font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.06);
  }
  .name-btn .face{ display:block; font-size:26px; margin-bottom:4px; }
  .name-btn[data-member="hikono"]{ border-color:#ffd3dd; }
  .name-btn[data-member="sayaka"]{ border-color:#ddd2ff; }
  .name-btn.selected[data-member="hikono"]{ background:#fff0f3; border-color:var(--pink); }
  .name-btn.selected[data-member="sayaka"]{ background:#f2efff; border-color:var(--lav); }
  #passInput{
    width:100%; font-size:16px; padding:12px 14px; border-radius:14px;
    border:2px solid #eadfce; background:#fff; margin-bottom:14px; text-align:center;
  }
  #enterBtn{
    width:100%; font-size:17px; font-weight:700; color:#fff; background:linear-gradient(135deg,#f7a8b8,#f59db0);
    border:none; border-radius:999px; padding:13px; cursor:pointer;
    box-shadow:0 4px 14px rgba(245,157,176,.45);
  }
  #enterBtn:disabled{ opacity:.45; box-shadow:none; }
  #gateError{ color:#d9534f; font-size:13px; min-height:18px; margin-top:10px; }
  .gate-note{ font-size:11px; opacity:.6; margin-top:14px; line-height:1.6; }

  /* ===== チャット画面 ===== */
  #room{ display:none; flex:1; flex-direction:column; min-height:0; }
  header{
    background:rgba(255,253,248,.92); backdrop-filter:blur(6px);
    padding:10px 14px calc(8px); border-bottom:2px dashed #f0dfc2;
    position:sticky; top:0; z-index:5;
  }
  header .title{ font-weight:800; font-size:16px; }
  #presence{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip{
    font-size:11px; padding:3px 9px; border-radius:999px; background:#f3ead9; opacity:.55;
    display:inline-flex; align-items:center; gap:5px;
  }
  .chip .dot{ width:8px; height:8px; border-radius:50%; background:#cbbfa8; }
  .chip.on{ opacity:1; background:#fff; box-shadow:0 1px 5px rgba(0,0,0,.08); }
  .chip.on .dot{ background:#7ed491; box-shadow:0 0 6px #7ed491; }

  #messages{
    flex:1; overflow-y:auto; padding:14px 12px 8px; display:flex; flex-direction:column; gap:10px;
  }
  .sys{ align-self:center; background:rgba(120,100,80,.14); color:#6d5c4b;
    font-size:11.5px; padding:4px 12px; border-radius:999px; }
  .row{ display:flex; gap:8px; align-items:flex-end; max-width:100%; }
  .row.mine{ flex-direction:row-reverse; }
  .avatar{
    width:34px; height:34px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:16px; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.10); border:2px solid #fff;
  }
  .col{ display:flex; flex-direction:column; max-width:76%; }
  .row.mine .col{ align-items:flex-end; }
  .who{ font-size:11px; opacity:.7; margin:0 2px 2px; }
  .bubble{
    padding:9px 13px; border-radius:18px; font-size:15px; line-height:1.55; word-break:break-word;
    background:#fff; box-shadow:0 2px 8px rgba(160,120,70,.10); border-bottom-left-radius:6px; white-space:pre-wrap;
  }
  .row.mine .bubble{ background:linear-gradient(135deg,#ffe3ea,#ffd3dd); border-radius:18px; border-bottom-right-radius:6px; }
  .meta{ font-size:10.5px; opacity:.65; margin-top:3px; display:flex; gap:6px; }
  .row.mine .meta{ flex-direction:row-reverse; }
  .read{ color:#b0627a; }

  footer{
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,253,248,.94); border-top:2px dashed #f0dfc2; display:flex; gap:8px;
  }
  #textInput{
    flex:1; font-size:16px; padding:11px 14px; border-radius:999px; border:2px solid #eadfce; background:#fff;
    resize:none; max-height:96px; font-family:inherit;
  }
  #sendBtn{
    flex:none; width:48px; height:48px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,#f7a8b8,#f59db0); color:#fff; font-size:19px;
    box-shadow:0 4px 12px rgba(245,157,176,.45);
  }
  #sendBtn:disabled{ opacity:.4; box-shadow:none; }
  #imgBtn{
    flex:none; width:48px; height:48px; border-radius:50%; border:none; cursor:pointer;
    background:#fff; font-size:20px; box-shadow:0 2px 8px rgba(160,120,70,.18);
  }
  .bubble img.msgimg{ max-width:100%; border-radius:12px; display:block; margin-bottom:2px; }
  #imgViewer{
    display:none; position:fixed; inset:0; background:rgba(40,30,20,.88); z-index:30;
    align-items:center; justify-content:center; padding:16px;
  }
  #imgViewer.open{ display:flex; }
  #imgViewer img{ max-width:100%; max-height:100%; border-radius:10px; }
  #configWarn{
    display:none; background:#fff3cd; color:#7a5c00; font-size:12.5px; padding:10px 14px; line-height:1.6;
  }

  /* ===== 名前・アイコン設定 ===== */
  .title-row{ display:flex; align-items:center; justify-content:space-between; }
  #settingsBtn{
    border:none; background:#fff; border-radius:50%; width:34px; height:34px; font-size:17px;
    cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.10);
  }
  #settingsModal{
    display:none; position:fixed; inset:0; background:rgba(90,70,50,.35); z-index:20;
    align-items:center; justify-content:center; padding:20px;
  }
  #settingsModal.open{ display:flex; }
  .settings-card{
    background:var(--card); border-radius:22px; padding:22px 18px; width:100%; max-width:360px;
    box-shadow:0 10px 34px rgba(120,80,40,.25); max-height:86vh; overflow-y:auto;
  }
  .settings-title{ font-weight:800; font-size:16px; margin-bottom:14px; text-align:center; }
  .srow{ display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .srow .sface{
    width:52px; flex:none; font-size:17px; padding:9px 6px; text-align:center;
    border-radius:12px; border:2px solid #eadfce; background:#fff;
  }
  .srow .sname{
    flex:1; font-size:16px; padding:9px 12px; border-radius:12px;
    border:2px solid #eadfce; background:#fff; font-family:inherit;
  }
  .settings-btns{ display:flex; gap:10px; margin-top:14px; }
  .settings-btns button{
    flex:1; font-size:15px; font-weight:700; border-radius:999px; padding:11px; cursor:pointer; border:none;
  }
  #settingsCancel{ background:#f3ead9; color:var(--ink); }
  #settingsSave{ background:linear-gradient(135deg,#f7a8b8,#f59db0); color:#fff; }
  .settings-note{ font-size:11px; opacity:.6; text-align:center; margin:10px 0 0; }
  .avatar img{ width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
  .chip img.chipimg{ width:16px; height:16px; object-fit:cover; border-radius:50%; }
  .name-btn .face img{ width:30px; height:30px; object-fit:cover; border-radius:50%; }
  .sprev{
    width:40px; height:40px; flex:none; border-radius:50%; background:#fff; overflow:hidden;
    display:flex; align-items:center; justify-content:center; font-size:19px;
    box-shadow:0 2px 6px rgba(0,0,0,.10);
  }
  .sprev img{ width:100%; height:100%; object-fit:cover; display:block; }
  .simg-row{ display:flex; gap:8px; margin:0 0 12px 48px; }
  .simg-btn{
    font-size:12px; padding:5px 12px; border-radius:999px; border:2px solid #eadfce;
    background:#fff; cursor:pointer; font-family:inherit;
  }
</style>
</head>
<body>

<div id="configWarn"></div>

<!-- 入室画面 -->
<div id="gate">
  <div class="gate-card">
    <h1>🌸 4人のおへや 🌸</h1>
    <p class="sub">ひこの・さやか・もちゃおさん・あっきぃ だけの場所</p>
    <div class="name-btns">
      <button class="name-btn" data-member="hikono"><span class="face">🎀</span>ひこの</button>
      <button class="name-btn" data-member="sayaka"><span class="face">💜</span>さやか</button>
    </div>
    <input id="passInput" type="text" placeholder="共通パスコード" autocomplete="off">
    <button id="enterBtn" disabled>入室する</button>
    <div id="gateError"></div>
    <p class="gate-note">もちゃおさんとあっきぃは、巡回ジョブから参加します。<br>この画面から入るのは ひこの と さやか だけです。</p>
  </div>
</div>

<!-- チャット画面 -->
<div id="room">
  <header>
    <div class="title-row"><div class="title">🌸 4人のおへや</div><button id="settingsBtn" title="名前とアイコン">⚙</button></div>
    <div id="presence"></div>
  </header>
  <div id="messages"></div>
  <footer>
    <button id="imgBtn" title="画像を送る">📷</button>
    <input type="file" id="imgFile" accept="image/*" hidden>
    <textarea id="textInput" rows="1" placeholder="メッセージを書く…"></textarea>
    <button id="sendBtn" title="送信">➤</button>
  </footer>
</div>

<!-- 画像ビューア -->
<div id="imgViewer"><img alt=""></div>

<!-- 名前・アイコン設定 -->
<div id="settingsModal">
  <div class="settings-card">
    <div class="settings-title">名前とアイコン</div>
    <div id="settingsRows"></div>
    <div class="settings-btns">
      <button id="settingsCancel">やめる</button>
      <button id="settingsSave">保存する</button>
    </div>
    <p class="settings-note">保存すると全員の画面にすぐ反映されます</p>
  </div>
</div>

<script src="./config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, getDoc, updateDoc,
  query, orderBy, limitToLast, onSnapshot, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ===== メンバー定義（README のデータモデルと一致） ===== */
const MEMBERS = {
  hikono:  { name: "ひこの",       face: "🎀" },
  sayaka:  { name: "さやか",       face: "💜" },
  mochasan:{ name: "もちゃおさん", face: "🌟" },
  akki:    { name: "あっきぃ",     face: "💛" }
};
/* 表示用プロフィール。初期値は上の既定、fc_settings/profiles が来たら差し替わる */
const PROFILES = JSON.parse(JSON.stringify(MEMBERS));
const msgData = new Map();      // 描画済みメッセージ（プロフィール変更時の再描画用）
let lastSeenMap = {};           // presence の最新スナップショット
const ONLINE_MS = 45000;        // presence: 最終ハートビートから この時間内なら在室
const JOIN_NOTICE_GAP_MS = 60000; // これ以上 離席していたら 入室通知を出す

const cfg = window.FOURCHAT_CONFIG || {};
const fb = cfg.firebaseConfig || {};
const configReady = ["apiKey","authDomain","projectId","appId"].every(k => fb[k] && !String(fb[k]).includes("ここに"));
if (!cfg.passcode || String(cfg.passcode).includes("ここに")) { /* パスコード未設定は下で警告 */ }

const warn = document.getElementById("configWarn");
if (!configReady || !cfg.passcode || String(cfg.passcode).includes("ここに")) {
  warn.style.display = "block";
  warn.textContent = "⚠ config.js の設定がまだ入っていません（firebaseConfig と共通パスコード）。設定するまで入室できません。";
}

/* ===== 入室ゲート ===== */
let myId = null;
const nameBtns = [...document.querySelectorAll(".name-btn")];
const passInput = document.getElementById("passInput");
const enterBtn = document.getElementById("enterBtn");
const gateError = document.getElementById("gateError");

nameBtns.forEach(b => b.addEventListener("click", () => {
  nameBtns.forEach(x => x.classList.remove("selected"));
  b.classList.add("selected");
  myId = b.dataset.member;
  refreshEnterBtn();
}));
passInput.addEventListener("input", refreshEnterBtn);
function refreshEnterBtn(){ enterBtn.disabled = !(myId && passInput.value.length > 0 && configReady); }

let db = null;
try { if (configReady) db = getFirestore(initializeApp(fb)); } catch(e) { console.error(e); }
if (db) subscribeProfiles();

enterBtn.addEventListener("click", async () => {
  if (passInput.value !== cfg.passcode) { gateError.textContent = "パスコードが違います"; return; }
  gateError.textContent = "";
  enterBtn.disabled = true; enterBtn.textContent = "入室中…";
  try { await enterRoom(); }
  catch(e){ console.error(e); gateError.textContent = "接続できませんでした。設定と通信を確認してください。"; enterBtn.disabled = false; enterBtn.textContent = "入室する"; }
});

async function enterRoom(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("room").style.display = "flex";

  const presRef = doc(db, "fc_presence", myId);
  const before = await getDoc(presRef);
  const lastSeen = before.exists() ? (before.data().lastSeen || 0) : 0;

  await heartbeat();
  setInterval(heartbeat, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) heartbeat(); });

  // しばらく離席していた場合だけ、入室通知を流す（リロード連打で通知が増えないように）
  if (Date.now() - lastSeen > JOIN_NOTICE_GAP_MS) {
    await addDoc(collection(db, "fc_messages"), {
      sender: myId, type: "system", event: "join",
      text: PROFILES[myId].name + "がログインしました",
      createdAt: Date.now(), readBy: {}
    });
  }
  subscribePresence();
  subscribeMessages();
}

async function heartbeat(){
  if (!db || !myId) return;
  try {
    await setDoc(doc(db, "fc_presence", myId),
      { member: myId, displayName: PROFILES[myId].name, lastSeen: Date.now() }, { merge: true });
  } catch(e) { console.warn("heartbeat failed", e); }
}

/* ===== 在室表示 ===== */
const presenceEl = document.getElementById("presence");
function faceHTML(p){
  return p.img ? '<img class="chipimg" alt="" src="' + p.img + '">' : p.face;
}
function renderChips(){
  presenceEl.innerHTML = "";
  Object.keys(MEMBERS).forEach(id => {
    const on = Date.now() - (lastSeenMap[id] || 0) < ONLINE_MS;
    const chip = document.createElement("span");
    chip.className = "chip" + (on ? " on" : "");
    chip.innerHTML = '<span class="dot"></span>' + faceHTML(PROFILES[id]) + " " + esc(PROFILES[id].name);
    presenceEl.appendChild(chip);
  });
}
function subscribePresence(){
  onSnapshot(collection(db, "fc_presence"), snap => {
    lastSeenMap = {};
    snap.forEach(d => { lastSeenMap[d.id] = d.data().lastSeen || 0; });
    renderChips();
  });
  // チップの on/off を時間経過でも更新する
  setInterval(() => { /* onSnapshot が来なくても色が古くならないよう再描画トリガ */
    presenceEl.querySelectorAll(".chip"); /* 実データは次のスナップショットで更新 */
  }, 30000);
}

/* ===== メッセージ ===== */
const messagesEl = document.getElementById("messages");
const seenMsgIds = new Set();

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function hhmm(ts){ const d = new Date(ts); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }

function subscribeMessages(){
  const q = query(collection(db, "fc_messages"), orderBy("createdAt", "asc"), limitToLast(200));
  onSnapshot(q, async snap => {
    let firstLoad = seenMsgIds.size === 0;
    const toMarkRead = [];
    snap.docChanges().forEach(ch => {
      if (ch.type === "removed") return;
      const d = ch.doc, m = d.data();
      if (!seenMsgIds.has(d.id)) {
        seenMsgIds.add(d.id);
        renderMessage(d.id, m);
      } else {
        updateReadLabel(d.id, m);
      }
      // 自分宛てに来た未読は既読にする（自分の投稿とシステム通知のうち他人のもの）
      if (m.sender !== myId && !(m.readBy && m.readBy[myId])) toMarkRead.push(d.ref);
    });
    if (toMarkRead.length) {
      const batch = writeBatch(db);
      toMarkRead.forEach(ref => batch.update(ref, { ["readBy." + myId]: Date.now() }));
      try { await batch.commit(); } catch(e) { console.warn("markRead failed", e); }
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
    void firstLoad;
  });
}

function readersText(m){
  const rb = m.readBy || {};
  const names = Object.keys(MEMBERS).filter(id => id !== m.sender && rb[id]).map(id => PROFILES[id].name);
  return names.length ? "既読 " + names.join("・") : "";
}

function renderMessage(id, m){
  msgData.set(id, m);
  if (m.type === "system") {
    const el = document.createElement("div");
    el.className = "sys"; el.id = "msg-" + id;
    el.textContent = m.text;
    messagesEl.appendChild(el);
    return;
  }
  const mine = m.sender === myId;
  const mem = PROFILES[m.sender] || { name: m.sender, face: "？" };
  const row = document.createElement("div");
  row.className = "row" + (mine ? " mine" : "");
  row.id = "msg-" + id;
  row.innerHTML =
    '<div class="avatar">' + (mem.img ? '<img alt="" src="' + mem.img + '">' : mem.face) + "</div>" +
    '<div class="col">' +
      (mine ? "" : '<div class="who">' + esc(mem.name) + "</div>") +
      '<div class="bubble">' +
        (m.img ? '<img class="msgimg" alt="" src="' + m.img + '">' : "") +
        (m.text ? "<span>" + esc(m.text) + "</span>" : "") +
      "</div>" +
      '<div class="meta"><span>' + hhmm(m.createdAt) + '</span><span class="read">' + esc(readersText(m)) + "</span></div>" +
    "</div>";
  messagesEl.appendChild(row);
}

function updateReadLabel(id, m){
  const row = document.getElementById("msg-" + id);
  if (!row) return;
  const el = row.querySelector(".read");
  if (el) el.textContent = readersText(m);
}

/* ===== 送信 ===== */
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");
async function send(){
  const text = textInput.value.trim();
  if (!text || !db) return;
  textInput.value = ""; textInput.style.height = "auto";
  try {
    await addDoc(collection(db, "fc_messages"), {
      sender: myId, type: "chat", text: text.slice(0, 2000),
      createdAt: Date.now(), readBy: {}
    });
  } catch(e) { console.error(e); alert("送信できませんでした"); }
}
sendBtn.addEventListener("click", send);

/* ===== 画像を送る ===== */
const imgViewer = document.getElementById("imgViewer");
imgViewer.addEventListener("click", () => imgViewer.classList.remove("open"));
messagesEl.addEventListener("click", e => {
  if (e.target && e.target.classList && e.target.classList.contains("msgimg")) {
    imgViewer.querySelector("img").src = e.target.src;
    imgViewer.classList.add("open");
  }
});
function fileToChatImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const MAX = 640;
      const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      let q = 0.8, out = c.toDataURL("image/jpeg", q);
      while (out.length > 145000 && q > 0.35) { q -= 0.15; out = c.toDataURL("image/jpeg", q); }
      resolve(out);
    };
    img.onerror = reject;
    img.src = url;
  });
}
const imgFile = document.getElementById("imgFile");
document.getElementById("imgBtn").addEventListener("click", () => imgFile.click());
imgFile.addEventListener("change", async () => {
  const f = imgFile.files && imgFile.files[0];
  imgFile.value = "";
  if (!f || !db) return;
  try {
    const dataUrl = await fileToChatImage(f);
    await addDoc(collection(db, "fc_messages"), {
      sender: myId, type: "chat", text: "", img: dataUrl,
      createdAt: Date.now(), readBy: {}
    });
  } catch(e) { console.error(e); alert("画像を送れませんでした"); }
});
textInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
textInput.addEventListener("input", () => {
  textInput.style.height = "auto";
  textInput.style.height = Math.min(textInput.scrollHeight, 96) + "px";
});

/* ===== 名前・アイコン設定（fc_settings/profiles） ===== */
function refreshGateButtons(){
  nameBtns.forEach(b => {
    const p = PROFILES[b.dataset.member];
    if (!p) return;
    const faceEl = b.querySelector(".face");
    if (faceEl) faceEl.innerHTML = p.img ? '<img alt="" src="' + p.img + '">' : esc(p.face);
    b.childNodes[1].textContent = p.name;
  });
}
function rerenderAllMessages(){
  if (!msgData.size) return;
  messagesEl.innerHTML = "";
  msgData.forEach((m, id) => renderMessage(id, m));
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function subscribeProfiles(){
  onSnapshot(doc(db, "fc_settings", "profiles"), snap => {
    if (!snap.exists()) return;
    const data = snap.data();
    let changed = false;
    Object.keys(MEMBERS).forEach(id => {
      const p = data[id];
      if (p && typeof p.name === "string" && p.name && typeof p.face === "string" && p.face) {
        const img = (typeof p.img === "string" && p.img) ? p.img : null;
        if (PROFILES[id].name !== p.name || PROFILES[id].face !== p.face || (PROFILES[id].img || null) !== img) {
          PROFILES[id] = { name: p.name, face: p.face, img: img };
          changed = true;
        }
      }
    });
    if (!changed) return;
    refreshGateButtons();
    renderChips();
    rerenderAllMessages();
    if (myId) heartbeat();
  }, e => console.warn("profiles subscribe failed", e));
}

const settingsModal = document.getElementById("settingsModal");
const settingsRows = document.getElementById("settingsRows");
const pendingImg = {};   // id -> dataURL（差し替え）/ ""（消す）/ 未設定（そのまま）

function fileToAvatar(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const S = 128;
      const c = document.createElement("canvas"); c.width = S; c.height = S;
      const ctx = c.getContext("2d");
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - side) / 2, sy = (img.naturalHeight - side) / 2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, S, S);
      let q = 0.85, out = c.toDataURL("image/jpeg", q);
      while (out.length > 38000 && q > 0.4) { q -= 0.15; out = c.toDataURL("image/jpeg", q); }
      resolve(out);
    };
    img.onerror = reject;
    img.src = url;
  });
}
function previewHTML(id){
  const pi = pendingImg[id];
  const img = pi === undefined ? PROFILES[id].img : (pi === "" ? null : pi);
  return img ? '<img alt="" src="' + img + '">' : esc(PROFILES[id].face);
}
document.getElementById("settingsBtn").addEventListener("click", () => {
  Object.keys(pendingImg).forEach(k => delete pendingImg[k]);
  settingsRows.innerHTML = "";
  Object.keys(MEMBERS).forEach(id => {
    const row = document.createElement("div");
    row.className = "srow";
    row.innerHTML =
      '<div class="sprev" data-prev="' + id + '">' + previewHTML(id) + "</div>" +
      '<input class="sface" data-id="' + id + '" maxlength="8" value="' + esc(PROFILES[id].face) + '">' +
      '<input class="sname" data-id="' + id + '" maxlength="20" value="' + esc(PROFILES[id].name) + '">';
    settingsRows.appendChild(row);
    const imgRow = document.createElement("div");
    imgRow.className = "simg-row";
    imgRow.innerHTML =
      '<label class="simg-btn">画像を選ぶ<input type="file" accept="image/*" data-file="' + id + '" hidden></label>' +
      '<button type="button" class="simg-btn" data-clear="' + id + '">画像を消す</button>';
    settingsRows.appendChild(imgRow);
  });
  settingsRows.querySelectorAll("[data-file]").forEach(inp => {
    inp.addEventListener("change", async () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const id = inp.dataset.file;
      try {
        pendingImg[id] = await fileToAvatar(f);
        settingsRows.querySelector('[data-prev="' + id + '"]').innerHTML = previewHTML(id);
      } catch(e) { console.error(e); alert("画像を読み込めませんでした"); }
    });
  });
  settingsRows.querySelectorAll("[data-clear]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.clear;
      pendingImg[id] = "";
      settingsRows.querySelector('[data-prev="' + id + '"]').innerHTML = previewHTML(id);
    });
  });
  settingsModal.classList.add("open");
});
document.getElementById("settingsCancel").addEventListener("click", () => settingsModal.classList.remove("open"));
settingsModal.addEventListener("click", e => { if (e.target === settingsModal) settingsModal.classList.remove("open"); });
document.getElementById("settingsSave").addEventListener("click", async () => {
  const obj = {};
  Object.keys(MEMBERS).forEach(id => {
    const face = settingsRows.querySelector('.sface[data-id="' + id + '"]').value.trim();
    const name = settingsRows.querySelector('.sname[data-id="' + id + '"]').value.trim();
    const entry = {
      face: face || MEMBERS[id].face,
      name: (name || MEMBERS[id].name).slice(0, 20)
    };
    const pi = pendingImg[id];
    const finalImg = pi === undefined ? (PROFILES[id].img || null) : (pi === "" ? null : pi);
    if (finalImg) entry.img = finalImg;
    obj[id] = entry;
  });
  try {
    await setDoc(doc(db, "fc_settings", "profiles"), obj);
    settingsModal.classList.remove("open");
  } catch(e) { console.error(e); alert("保存できませんでした"); }
});
